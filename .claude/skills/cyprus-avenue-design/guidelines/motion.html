<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;background:var(--bg-page)}
.sw{display:grid;gap:8px}
.chip{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
.n{font:600 13px/1.2 var(--font-ui)}
.v{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}
.grid{display:grid;gap:12px}

</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px">
<div style="border-top:2px solid var(--ink-900);padding-top:10px"><div style="font:850 36px/1 var(--font-display);letter-spacing:-.04em">120ms</div><div class="v" style="margin-top:6px">--dur-fast · hover, color</div></div><div style="border-top:2px solid var(--ink-900);padding-top:10px"><div style="font:850 36px/1 var(--font-display);letter-spacing:-.04em">180ms</div><div class="v" style="margin-top:6px">--dur-base · arrows, scrim</div></div><div style="border-top:2px solid var(--ink-900);padding-top:10px"><div style="font:850 36px/1 var(--font-display);letter-spacing:-.04em">320ms</div><div class="v" style="margin-top:6px">--dur-slow · dialog rise</div></div>
</div><div class="v" style="margin-top:16px">--ease-out cubic-bezier(.2,.7,.2,1) · no bounces, no parallax, respects prefers-reduced-motion</div>
</body></html>
