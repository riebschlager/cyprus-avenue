<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Flat page; shadows only on floating layers" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;background:var(--bg-page)}
.sw{display:grid;gap:8px}
.chip{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
.n{font:600 13px/1.2 var(--font-ui)}
.v{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}
.grid{display:grid;gap:12px}

</style></head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:8px">
<div><div style="height:96px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-0);border:1px solid var(--border-hairline)"></div><div class="n" style="margin-top:10px">Page content — none</div><div class="v">--shadow-0</div></div><div><div style="height:96px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-pop);border:0"></div><div class="n" style="margin-top:10px">Menus, toasts</div><div class="v">--shadow-pop</div></div><div><div style="height:96px;background:var(--bg-surface);border-radius:4px;box-shadow:var(--shadow-dialog);border:0"></div><div class="n" style="margin-top:10px">Dialogs</div><div class="v">--shadow-dialog</div></div>
</div>
</body></html>
