<!-- @dsCard group="Colors" viewport="700x150" name="Ring blue & status" subtitle="Focus, success, error — used sparingly" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;background:var(--bg-page)}
.sw{display:grid;gap:8px}
.chip{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
.n{font:600 13px/1.2 var(--font-ui)}
.v{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}
.grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(6,1fr)"><div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div><div class="n">Blue 100</div><div class="v">--blue-100<br>#DCE7F5</div></div></div><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div><div class="n">Blue 500 · focus</div><div class="v">--blue-500<br>#3D73BF</div></div></div><div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div><div class="n">Blue 700</div><div class="v">--blue-700<br>#224A82</div></div></div><div class="sw"><div class="chip" style="background:var(--green-600)"></div><div><div class="n">Success</div><div class="v">--green-600<br>#2F7A4B</div></div></div><div class="sw"><div class="chip" style="background:var(--red-600)"></div><div><div class="n">Error</div><div class="v">--red-600<br>#B33A2E</div></div></div><div class="sw"><div class="chip" style="background:var(--brand-spotify)"></div><div><div class="n">Spotify (links only)</div><div class="v">--brand-spotify<br>#1DB954</div></div></div></div>
</body></html>
