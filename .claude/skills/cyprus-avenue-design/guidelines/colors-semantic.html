<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;background:var(--bg-page)}
.sw{display:grid;gap:8px}
.chip{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
.n{font:600 13px/1.2 var(--font-ui)}
.v{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}
.grid{display:grid;gap:12px}

</style></head><body>
<div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div style="background:var(--bg-page);color:var(--fg-1);padding:16px;height:140px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-hairline)"><span style="font:800 28px/1 var(--font-display);letter-spacing:-.03em">Aa</span><div><div class="n">Page</div><div style="font:500 11px/1.3 var(--font-mono);opacity:.8">Ink 900 on paper</div></div></div><div style="background:var(--bg-sunken);color:var(--fg-2);padding:16px;height:140px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-hairline)"><span style="font:800 28px/1 var(--font-display);letter-spacing:-.03em">Aa</span><div><div class="n">Sunken</div><div style="font:500 11px/1.3 var(--font-mono);opacity:.8">Ink 600 on paper 100</div></div></div><div style="background:var(--orange-500);color:var(--ink-900);padding:16px;height:140px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-hairline)"><span style="font:800 28px/1 var(--font-display);letter-spacing:-.03em">Aa</span><div><div class="n">Accent</div><div style="font:500 11px/1.3 var(--font-mono);opacity:.8">Ink on label orange</div></div></div><div style="background:var(--ink-950);color:var(--paper-50);padding:16px;height:140px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border-hairline)"><span style="font:800 28px/1 var(--font-display);letter-spacing:-.03em">Aa</span><div><div class="n">Inverse</div><div style="font:500 11px/1.3 var(--font-mono);opacity:.8">Paper on ink 950</div></div></div>
</div>
</body></html>
