<!-- @dsCard group="Spacing" viewport="700x210" name="Rules & radii" subtitle="Hierarchy comes from rules, not boxes" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;background:var(--bg-page)}
.sw{display:grid;gap:8px}
.chip{height:64px;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
.n{font:600 13px/1.2 var(--font-ui)}
.v{font:500 11px/1.3 var(--font-mono);color:var(--fg-3);letter-spacing:.02em}
.grid{display:grid;gap:12px}

</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">
<div style="display:flex;flex-direction:column;gap:18px">
<div><div style="border-top:var(--rule-heavy)"></div><div class="v" style="margin-top:6px">--rule-heavy — 4px ink · section opener</div></div><div><div style="border-top:var(--rule-ink)"></div><div class="v" style="margin-top:6px">--rule-ink — 2px ink · list top</div></div><div><div style="border-top:var(--rule-strong)"></div><div class="v" style="margin-top:6px">--rule-strong — 1px paper 300 · inputs</div></div><div><div style="border-top:var(--rule-hair)"></div><div class="v" style="margin-top:6px">--rule-hair — 1px paper 200 · between rows</div></div>
</div>
<div style="display:flex;gap:16px;align-items:flex-start">
<div style="text-align:center"><div style="width:56px;height:56px;border:2px solid var(--ink-900);border-radius:var(--radius-0)"></div><div class="v" style="margin-top:6px">0</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:2px solid var(--ink-900);border-radius:var(--radius-1)"></div><div class="v" style="margin-top:6px">2</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:2px solid var(--ink-900);border-radius:var(--radius-2)"></div><div class="v" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:56px;height:56px;border:2px solid var(--ink-900);border-radius:var(--radius-pill)"></div><div class="v" style="margin-top:6px">pill</div></div>
</div></div>
</body></html>
