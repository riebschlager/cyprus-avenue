<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{padding:24px;background:var(--bg-page)} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script src="../../assets/ds-loader.js"></script>
<script type="text/ca-jsx">
function Demo(){  return (
<div style={{display:'grid',gridTemplateColumns:'1fr 220px',gap:24,alignItems:'start'}}>

  </div>
  <div className="stack" style={{gridColumn:'1 / -1'}}>
    <div className="row"><Toast tone="success" action="Open" onClose={()=>{}}>Playlist created · 13 tracks</Toast><Toast tone="error">Spotify connection expired</Toast></div>
  </div>
</div>); }
